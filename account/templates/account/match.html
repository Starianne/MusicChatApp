<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'css/match.css' %}">
    <title>match</title>
</head>
<body>
    <div class="logoContainer">
    <div class="logo">
        <h1>musichat</h1><h1 id="dot">.</h1><h1>net&nbsp;</h1>
    </div>
    
</div>

    <div id="container">
        <div id="readyContainer">
        <div id="heading">
        <h2>ready to find your match</h2><h2 id="punctuation">?</h2>
        </div>
        <div id="song_search">
            <h2 id="btntxt">lets go!</h2>
        </div>
    </div>
    </div>
</body>
<script>
    let songSearchContainer = document.getElementById('song_search')

    //add event listener click to lead to other pages 
    function animateWithEvent(element, animationClass) {
        return new Promise((resolve) => {
            element.style.background = '#00C6CF'
            element.classList.toggle(animationClass);
            element.addEventListener('transitionend', () => {
                resolve();
            }, { once: true});
        });
    }
    songSearchContainer.addEventListener('click', function() {
        function songSearchTransition() {
            return new Promise((resolve) => {
                resolve(window.location.replace("/account/songSearch"));
            });
        }
        async function sequenceSong(){
            await animateWithEvent(songSearchContainer, 'active');
            await songSearchTransition();
        }

        sequenceSong();
    });
</script>
</html>
