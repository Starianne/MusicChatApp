<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        home
    </title>
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
    <!-- add a script tag here for when you add javascript into the static folder-->
</head>
<body>
<div class="logoContainer">
    <div class="logo">
        <h1>musichat</h1><h1 id="dot">.</h1><h1>net&nbsp;</h1>
    </div>
    <div class="userGreeting">
        <h1>Hello</h1><h1 id="comma">,&nbsp;&nbsp;</h1><h1>{{request.user}}</h1>
        <a href="/account/logout/"><button id="logoutBtn">logout?</button></a>
    </div>
    
</div>

<div class="homeMenu">
    <div class="card">
        <h2>chats</h2>
        <div id="chatPreviewList">
            <!--filled by js-->
        </div>
        <button class="menu" onclick="window.location.href='/chat/'">see more</button>
    </div>


    <div class="card matchNewMenu">
        <h2>find someone new?</h2>
        <button class="menu" onclick="window.location.href = '/account/match/'">let's go!</button>
    </div>

    <div class="card addUserMenu">
        <h2>add user:</h2>
        <div id="searchWrapper">
            <input id="userSearch" type="userSearch" placeholder="search for user...">
            <ul id="searchDropdown"></ul>
        </div>
    </div>
</div>
</body>

<script>
    function truncateString(str, maxLength) {
        return str.length > maxLength
        ? str.slice(0, maxLength - 3) + '...'
        : str;
    }
        fetch('/chat/my_chats/', {
        headers: { 'X-CSRFToken': '{{ csrf_token }}' }
    })
    .then(res => res.json())
    .then(data => {
        const list = document.getElementById('chatPreviewList');
        const chats = data.accepted.slice(0, 3); //show max 3 on home
 
        if (chats.length === 0) {
            list.innerHTML = `<p id="noChats">no chats yet — find someone new!</p>`;
            return;
        }
 
        chats.forEach(chat => {
            const item = document.createElement('div');
            item.classList.add('chatPreview');
            item.innerHTML = `
                <span class="previewName">${chat.name}</span>
                <span class="previewMsg">${chat.last_message ? truncateString(chat.last_message) : 'no messages yet'}</span>
            `;
            item.addEventListener('click', () => {
                window.location.href = `/chat/${chat.chat_id}/`;
            });
            list.appendChild(item);
        });
    });
    //search bar 
    const searchInput = document.getElementById('userSearch');
    const dropdown = document.getElementById('searchDropdown');
    let debounceTimer;
 
    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const query = searchInput.value.trim();
 
        if (query.length === 0) {
            dropdown.style.display = 'none';
            dropdown.innerHTML = '';
            return;
        }
 
        debounceTimer = setTimeout(() => {
            fetch(`/chat/search_users/?q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    dropdown.innerHTML = '';
 
                    if (data.users.length === 0) {
                        dropdown.innerHTML = `<li class="noResults">no users found</li>`;
                    } else {
                        data.users.forEach(user => {
                            const li = document.createElement('li');
                            li.classList.add('searchResult');
                            li.innerHTML = `
                                <span>${user.username}</span>
                                <button class="matchBtn" data-id="${user.id}">match</button>
                            `;
                            li.querySelector('.matchBtn').addEventListener('click', () => {
                                forceMatch(user.id, li);
                            });
                            dropdown.appendChild(li);
                        });
                    }
 
                    dropdown.style.display = 'block';
                });
        }, 250);
    });
 
    document.addEventListener('click', (e) => {
        if (!document.getElementById('searchWrapper').contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });
 
    //force match data
    function forceMatch(userId, listItem) {
        const btn = listItem.querySelector('.matchBtn');
        btn.textContent = 'matching…';
        btn.disabled = true;
 
        fetch('/chat/force_match/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}',
            },
            body: JSON.stringify({ target_user_id: userId }),
        })
        .then(res => res.json())
        .then(data => {
            window.location.href = `/chat/${data.chat_id}/`;
        });
    }
</script>
</html>
