<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        home
    </title>
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
    <!-- add a script tag here for when you add javascript into the static folder-->
</head>
<body>
<div class="logoContainer">
    <div class="logo">
        <h1>musichat</h1><h1 id="dot">.</h1><h1>net&nbsp;</h1>
    </div>
    <div class="userGreeting">
        <h1>Hello</h1><h1 id="comma">,&nbsp;&nbsp;</h1><h1>{{request.user}}</h1>
        <a href="/account/logout/"><button id="logoutBtn">logout?</button></a>
    </div>
    
</div>

<div class="homeMenu">
    <div class="card">
        <h2>chats</h2>
        <div id="chatPreviewList">
            <!--filled by js-->
        </div>
        <button class="menu" onclick="window.location.href='/chat/'">see more</button>
    </div>


    <div class="card matchNewMenu">
        <h2>find someone new?</h2>
        <button class="menu" onclick="window.location.href = '/account/match/'">let's go!</button>
    </div>

    <div class="card addUserMenu">
        <h2>add user:</h2>
        <div id="searchWrapper">
            <input type="userSearch" placeholder="search for user...">
        </div>
    </div>
</div>
</body>

<script>
        fetch('/chat/my_chats/', {
        headers: { 'X-CSRFToken': '{{ csrf_token }}' }
    })
    .then(res => res.json())
    .then(data => {
        const list = document.getElementById('chatPreviewList');
        const chats = data.accepted.slice(0, 3); //show max 3 on home
 
        if (chats.length === 0) {
            list.innerHTML = `<p id="noChats">no chats yet — find someone new!</p>`;
            return;
        }
 
        chats.forEach(chat => {
            const item = document.createElement('div');
            item.classList.add('chatPreview');
            item.innerHTML = `
                <span class="previewName">${chat.name}</span>
                <span class="previewMsg">${chat.last_message ? chat.last_message : 'no messages yet'}</span>
            `;
            item.addEventListener('click', () => {
                window.location.href = `/chat/${chat.chat_id}/`;
            });
            list.appendChild(item);
        });
    });
</script>
</html>
