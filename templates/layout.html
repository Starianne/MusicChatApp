<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}{% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/stylesheet.css' %}">
    <!-- add a script tag here for when you add javascript into the static folder-->
</head>
<body>
    <nav>
        <ul>
            <li> Hi there, {{request.user}}</li>
            <li> <a href="{% url "account" %}">account</a></li>
            <li> <a href="{% url "register" %}">register </a></li>
            <li> <a href="{% url "login" %}">login</a></li>
            <li> <a href="{% url "callback" %}">callback</a></li>
            <li><a href="{% url "spotifylogin" %}">spotifylogin</a></li>
            <li><a href="{% url "logout" %}">logout</a></li>
            <!--fill in with more content later-->
        </ul>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
